<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#a54363" />
  <title>我们的日常</title>
  <!-- iOS 添加到主屏幕优先取这个名字,和 manifest 的 name 一样要跟随站点设置(由 app.js 更新) -->
  <meta name="apple-mobile-web-app-title" content="我们的日常" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5636f'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="site-brand">
        <a class="site-title" href="#/"><span class="site-heart" aria-hidden="true"></span><span class="site-name">我们的日常</span></a>
        <div class="days" id="days" hidden></div>
      </div>
      <nav class="site-nav" aria-label="主要导航">
        <div class="nav-segments">
          <a href="#/" data-nav="timeline">时间轴</a>
          <a href="#/gallery" data-nav="gallery">相册</a>
        </div>
        <!-- 桌面端滚过标题后接手写入口;移动端的入口在 Dock 里,这颗在窄屏不出现(app.js 控制槽的显隐) -->
        <span class="header-write-slot" id="headerWriteSlot" hidden>
          <button class="write-trigger header-write" id="headerWrite" type="button">写日常</button>
        </span>
        <span id="userArea"></span>
      </nav>
    </div>
  </header>

  <main id="main" class="container"></main>

  <nav class="mobile-nav" aria-label="主要导航">
    <a href="#/" data-mobile-nav="timeline"><span class="mobile-nav-icon" data-icon="list"></span><span>时间轴</span></a>
    <a href="#/gallery" data-mobile-nav="gallery"><span class="mobile-nav-icon" data-icon="image"></span><span>相册</span></a>
    <a class="mobile-compose" href="#/" aria-label="写日常"><span data-icon="pen-line"></span><span>写日常</span></a>
    <a href="#/settings" data-mobile-nav="settings"><span class="mobile-nav-icon" data-icon="settings"></span><span>设置</span></a>
  </nav>

  <!-- 媒体灯箱:图片 / 视频 / 实况图共用一个序列,一律由用户点击才播放 -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="关闭">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <button class="lb-btn lb-prev" aria-label="上一张">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="lb-stage" id="lightboxStage">
      <img id="lightboxImg" alt="" />
      <video id="lightboxVideo" playsinline preload="none" hidden></video>
      <button id="lightboxLive" class="lb-live" type="button" aria-pressed="false" hidden>
        <span class="lb-live-dot" aria-hidden="true"></span><span>LIVE</span>
      </button>
    </div>
    <button class="lb-btn lb-next" aria-label="下一张">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
