<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<meta name="theme-color" content="#a54363" />
<meta name="apple-mobile-web-app-title" content="我们的日常" />
<title>我们的日常</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
<div id="root"></div>
<dialog id="lightbox" class="lightbox" aria-label="查看图片" hidden>
  <button class="lb-btn lb-close" aria-label="关闭">×</button>
  <button class="lb-btn lb-prev" aria-label="上一张">‹</button>
  <div class="lb-viewport" id="lightboxViewport" tabindex="0" aria-label="图片浏览区域，可滚动，双击或双指缩放">
    <div class="lb-stage" id="lightboxStage">
      <img id="lightboxImg" alt="" draggable="false" hidden />
      <video id="lightboxVideo" playsinline preload="none" hidden></video>
      <button id="lightboxLive" class="lb-live" type="button" aria-pressed="false" hidden><span class="lb-live-dot"></span><span>LIVE</span></button>
    </div>
  </div>
  <button class="lb-btn lb-next" aria-label="下一张">›</button>
  <div class="lb-status"><span id="lightboxStatus" role="status" aria-live="polite"></span><button id="lightboxRetry" class="lb-retry" type="button" hidden>重试</button></div>
</dialog>
<script src="/vendor/motion.js"></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
